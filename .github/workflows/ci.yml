name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Skip build.rs network fetch in CI; the bundled snapshot is checked in.
  CCUSAGE_RS_OFFLINE_BUILD: "1"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-targets
      - run: cargo test --all-targets

  parity:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install ccusage (pinned)
        run: npm i -g ccusage@18.0.11
      - run: cargo build --release
      - name: Live parity diff
        run: |
          set -euo pipefail
          for fixture in tests/fixtures/*/; do
            name="$(basename "$fixture")"
            for cmd in daily monthly session blocks; do
              for order in desc asc; do
                diff <(CLAUDE_CONFIG_DIR="$PWD/$fixture" ccusage "$cmd" --json --timezone Asia/Seoul --offline --order "$order" | jq -S .) \
                     <(CLAUDE_CONFIG_DIR="$PWD/$fixture" ./target/release/ccusage-rs "$cmd" --json --timezone Asia/Seoul --offline --order "$order" | jq -S .) \
                  || { echo "PARITY FAILED: $name $cmd $order"; exit 1; }
              done
            done
          done
          echo "All parity diffs clean."
