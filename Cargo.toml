[package]
name = "ccusage-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Drop-in Rust reimplementation of ccusage with bit-exact JSON parity"
authors = ["dave <dave@elyvian.io>"]
license = "BSD-3-Clause"
repository = "https://github.com/dave/ccusage-rs"
homepage = "https://github.com/dave/ccusage-rs"
readme = "README.md"
keywords = ["claude", "ccusage", "cli", "billing", "tokens"]
categories = ["command-line-utilities"]

[[bin]]
name = "ccusage-rs"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"
clap = { version = "4", features = ["derive", "env"] }
comfy-table = "7"
dirs = "5"
# Embedded incremental parsed-row cache + file manifest. `bundled` compiles DuckDB's
# C++ amalgamation from source via the cc crate (no system libduckdb, no runtime dylib;
# fully static). First clean build is a one-time ~4-7min C++ compile; ~4s incremental
# relink once libduckdb-sys' object is cached. Binary grows ~7MB -> ~42MB; +~269 lock pkgs.
duckdb = { version = "1", features = ["bundled"] }
indexmap = { version = "2", features = ["serde"] }
rayon = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"

[build-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
